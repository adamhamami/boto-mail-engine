# ─── Docker Compose Production (Phase 7) ─────────────────────────────────────
# Prérequis :
#   1. cp .env.production.example .env   (non-secrets)
#   2. npm run docker:secrets            (crée ./secrets/*)
#   3. docker compose -f docker-compose.production.yml up -d --build
#
# HA workers : WORKER_REPLICAS=3 docker compose -f docker-compose.production.yml up -d --scale worker=3

name: botoschool-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botoschool}
      POSTGRES_DB: ${POSTGRES_DB:-botoschool_email}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas d'exposition publique en production
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    # Override via Release/Rollback : APP_IMAGE=ghcr.io/org/repo/app:v1.2.3
    image: ${APP_IMAGE:-botoschool-app:prod}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-botoschool}
      POSTGRES_DB: ${POSTGRES_DB:-botoschool_email}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      REDIS_URL: redis://redis:6379
      LOG_JSON: "true"
      RATE_LIMIT_STORE: redis
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      LOG_DIR: /app/logs
    secrets:
      - postgres_password
      - auth_secret
      - webhook_secret
      - smtp_password
    volumes:
      - app_logs:/app/logs
      - app_tmp:/.tmp
      - app_tmp:/app/.tmp
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "14"
        compress: "true"
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: worker
    image: ${WORKER_IMAGE:-botoschool-worker:prod}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-botoschool}
      POSTGRES_DB: ${POSTGRES_DB:-botoschool_email}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      REDIS_URL: redis://redis:6379
      WORKER_ENABLED: "true"
      LOG_JSON: "true"
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      LOG_DIR: /app/logs
    secrets:
      - postgres_password
      - auth_secret
      - webhook_secret
      - smtp_password
    volumes:
      - worker_logs:/app/logs
      - worker_tmp:/app/.tmp
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/docker-worker-healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "14"
        compress: "true"
    networks:
      - internal

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  auth_secret:
    file: ./secrets/auth_secret.txt
  webhook_secret:
    file: ./secrets/webhook_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

volumes:
  postgres_data:
  redis_data:
  app_logs:
  worker_logs:
  app_tmp:
  worker_tmp:

networks:
  internal:
    driver: bridge
