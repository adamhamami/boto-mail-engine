# Prometheus — scrape BotoSchool metrics (Étape 5)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: botoschool-app
    metrics_path: /api/ops/metrics
    params:
      format: [prometheus]
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    # Host app depuis le réseau Docker (override via extra_hosts)
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: botoschool-emailing
          env: local
