global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: http://host.docker.internal:3999/alerts
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: http://host.docker.internal:3999/alerts
        send_resolved: true

# Remplacer l'URL webhook par Slack/Teams/PagerDuty en prod.
# Tant que le webhook n'écoute pas, Alertmanager loggue les erreurs (non bloquant).
